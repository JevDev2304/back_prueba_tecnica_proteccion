spring:
  datasource:
    # Prioridad: DATABASE_URL (Railway) > DB_URL (AWS ECS) > H2 (local/emergencia)
    url: ${DB_URL:jdbc:h2:mem:pruebadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

ses:
  from-email: ${SES_FROM_EMAIL:noreply@juanespruebastecnicascolombia.com}
  region: ${SES_REGION:us-east-1}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars!!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  password: ${APP_PASSWORD:dev-password}

logging:
  level:
    com.prueba: DEBUG
    org.springframework.security: INFO
