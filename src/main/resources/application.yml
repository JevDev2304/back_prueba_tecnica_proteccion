spring:
  datasource:
    # Railway provee PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD automáticamente
    # AWS ECS usa DB_URL/DB_USER/DB_PASS como variables en la Task Definition
    # Local: usa los defaults (localhost:5432/prueba)
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:prueba}}
    username: ${DB_USER:${PGUSER:postgres}}
    password: ${DB_PASS:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

ses:
  from-email: ${SES_FROM_EMAIL:jevojob@gmail.com}
  region: ${SES_REGION:us-east-1}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  password: ${APP_PASSWORD:dev-password}

logging:
  level:
    com.prueba: DEBUG
    org.springframework.security: INFO
